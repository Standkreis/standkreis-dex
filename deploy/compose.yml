# The whole app on one VM (handoff 0010 Track A): `docker compose -f deploy/compose.yml up -d` from the repo root.
# Reads deploy/.env (copy .env.example). Four services, three named volumes, no host port for the database.
name: dex

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: dex
    # Loopback only: reachable from the VM itself and through `ssh -L 5434:localhost:5432` for the ETL, never from outside.
    ports:
      - "${DB_BIND:-127.0.0.1:5432}:5432"
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dex -d dex"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One shot: `prisma migrate deploy`, the only place production migrations ever run. `app` waits for its exit 0.
  migrate:
    build:
      context: ../app
      target: migrate
    environment:
      DATABASE_URL: postgresql://dex:${POSTGRES_PASSWORD}@db:5432/dex
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: ../app
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dex:${POSTGRES_PASSWORD}@db:5432/dex
      PHOTO_DIR: /data/photos
      WEBAUTHN_RP_ID: ${DOMAIN}
      WEBAUTHN_ORIGIN: https://${DOMAIN}
      WEBAUTHN_SECRET: ${WEBAUTHN_SECRET:?set WEBAUTHN_SECRET in deploy/.env (openssl rand -hex 32)}
    volumes:
      - photos:/data/photos
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /api/health is Track B's; until it is merged the check falls back to the locale root. Drop the `||` part after the merge.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || wget -q --spider http://127.0.0.1:3000/de/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started

volumes:
  pg:
  photos:
  caddy_data:
  caddy_config:
