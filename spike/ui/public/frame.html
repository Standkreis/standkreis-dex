<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}iframe{border:0;display:block}</style></head>
<body><iframe id="f"></iframe>
<script>
const q = new URLSearchParams(location.search)
const w = +(q.get('w') || 390), h = +(q.get('h') || 844), y = +(q.get('y') || 0)
const f = document.getElementById('f'); f.width = w; f.height = h
f.src = '/#' + (q.get('route') || '/grid/a')
f.onload = () => setTimeout(() => f.contentWindow.scrollTo(0, y), 300)
</script></body></html>
