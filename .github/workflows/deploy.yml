# Ships main to the VM by running deploy/deploy.sh over SSH. Manual only (workflow_dispatch) until the owner flips it:
# to deploy on every merge, add `push: { branches: [main] }` under `on`. Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY.
name: deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: ~/standkreis-dex/deploy/deploy.sh
